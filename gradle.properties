org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# The canonical project path (D:\AndroidProjects\...) is ASCII, but the project is also reachable
# through a junction inside the user's non-ASCII workspace, so the AGP path check is disabled
# explicitly rather than letting a build started from that side fail.
android.overridePathCheck=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official
