org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
# Kotlin 编译 daemon 独立限内存，避免与 Gradle 抢堆导致 dex OOM
kotlin.daemon.jvmargs=-Xmx896m -XX:MaxMetaspaceSize=256m
# AGP 9 强制 aapt2 daemon 模式；qemu 模拟下每个 daemon 都占内存，限制并发数
android.aapt2MaxDaemonInstances=1

# The canonical project path (D:\AndroidProjects\...) is ASCII, but the project is also reachable
# through a junction inside the user's non-ASCII workspace, so the AGP path check is disabled
# explicitly rather than letting a build started from that side fail.
android.overridePathCheck=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

kotlin.code.style=official

org.gradle.workers.max=1
