org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Xss1m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.parallel=false
# 工程路径含中文等非 ASCII 字符时，AGP 默认拒绝构建；允许这种路径
android.overridePathCheck=true
org.gradle.internal.http.connectionTimeout=20000
org.gradle.internal.http.socketTimeout=30000
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
